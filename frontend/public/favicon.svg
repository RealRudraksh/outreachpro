<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1040"/>
      <stop offset="100%" style="stop-color:#0d0820"/>
    </linearGradient>
    <linearGradient id="rocket" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff3cac"/>
      <stop offset="50%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#38bdf8"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#38bdf8"/>
    </linearGradient>
    <linearGradient id="flame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#ff3cac;stop-opacity:0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="16" cy="16" r="16" fill="url(#bg)"/>

  <!-- Outer Q ring (thick, bold) -->
  <circle cx="15" cy="15" r="9.5" fill="none" stroke="url(#ring)" stroke-width="2.8" opacity="0.95"/>

  <!-- Q tail -->
  <line x1="21.5" y1="21.5" x2="25" y2="25" stroke="url(#ring)" stroke-width="3" stroke-linecap="round"/>

  <!-- Rocket (centered, tilted 35deg) -->
  <g transform="translate(15,15) rotate(-35) translate(-15,-15)" filter="url(#glow)">
    <!-- Flame -->
    <path d="M15 20.5 C14.2 22 13.8 23.5 14 24.5 C14.5 23.8 15 23.8 15.5 24.5 C15.7 23.5 15.3 22 15 20.5Z"
          fill="url(#flame)"/>
    <!-- Body -->
    <path d="M15 7.5 C13 10 12.2 13.5 12.2 16.5 L12.2 20 Q15 21.2 17.8 20 L17.8 16.5 C17.8 13.5 17 10 15 7.5Z"
          fill="url(#rocket)"/>
    <!-- Nose highlight -->
    <path d="M15 7.5 C14.2 8.5 13.5 9.5 13.2 10.5 C14 9.8 15 9.5 15 9.5 C15 9.5 16 9.8 16.8 10.5 C16.5 9.5 15.8 8.5 15 7.5Z"
          fill="white" opacity="0.7"/>
    <!-- Window -->
    <circle cx="15" cy="15" r="1.8" fill="#0d0820" stroke="white" stroke-width="0.5" opacity="0.9"/>
    <circle cx="15" cy="15" r="1" fill="#8b5cf6" opacity="0.8"/>
    <!-- Left fin -->
    <path d="M12.2 18 L9.5 21 L12.2 19.8Z" fill="#ff3cac" opacity="0.9"/>
    <!-- Right fin -->
    <path d="M17.8 18 L20.5 21 L17.8 19.8Z" fill="#38bdf8" opacity="0.9"/>
  </g>
</svg>
